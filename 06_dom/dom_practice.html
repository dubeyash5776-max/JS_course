<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM Practice</title>
</head>

<body>

    <h1 id="count">0</h1>
   <button id="increase">Increase</button>

    <h1 id="title">Hello DOM</h1>

    <div class="card">
        <h2>Neon Pulse</h2>
        <p class="desk">Music Website</p>
    </div>

    <button id="btn">Click Me</button>
</body>

<script>
    const title = document.querySelector('#title');
    const card = document.querySelector(".card");
    const desk = document.querySelector(".desk");

    // console.log(title);
    // console.log(card);
    // console.log(desk);

    console.log(title);
    title.innerText = 'changed from Hello DOM'

    title.style.color = "blue"

    // Button click event 
    const button = document.querySelector("#btn");
    button.addEventListener("click", function () {
        alert("Butten is clicked!");
    })

    // change Text on button click
    // const button = document.querySelector("#btn");
    // const title = document.querySelector('#title');
    button.addEventListener("click", function () {
        title.innerText = "button clicked";
    });

    // change content on button
    // const button = document.querySelector("#btn");
    button.innerText = "mujhe dabao"

    // create new element



// event listener: "When a specific event happens on this element, run this function."

// | Event         | Happens when...          |
// | ------------- | ------------------------ |
// | `"click"`     | User clicks              |
// | `"dblclick"`  | User double-clicks       |
// | `"mouseover"` | Mouse enters the element |
// | `"mouseout"`  | Mouse leaves the element |
// | `"keydown"`   | Key is pressed           |
// | `"keyup"`     | Key is released          |
// | `"input"`     | User types in an input   |


    // When the button is clicked, make the heading red.
    button.addEventListener("click", function () {
        title.style.color = 'red'
    });

// Every click should increase the number:
    
    const count = document.querySelector('#count');
    const button2 = document.querySelector('#increase');
    button2.addEventListener("click", function () {
        count.innerText++;
    });

</script>
</html>
